# ITMC FenestrationOS — docker compose (db + api + web)
# Configure via ./.env (see .env.example). Secrets have NO defaults here on purpose.
name: fos

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fos
      POSTGRES_USER: fos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fos -d fos"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      ENV: ${ENV:-prod}
      DATABASE_URL: postgresql+psycopg://fos:${POSTGRES_PASSWORD}@db:5432/fos
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-0}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      FORWARDED_ALLOW_IPS: "*"   # api is only reachable from the compose network (nginx)
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
